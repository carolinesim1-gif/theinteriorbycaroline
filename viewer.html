<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer</title>
<meta name="robots" content="noindex, nofollow">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=DM+Mono:wght@300&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink:        #1a1612;
    --ink-soft:   #3a342d;
    --paper:      #f5f0e8;
    --paper-warm: #ece4d6;
    --muted:      #6f6659;
    --rule:       rgba(26,22,18,0.13);
    --accent:     #c47b6c;
    --accent-soft:#e8c9bf;
    --dark:       #2c2720;
  }

  html, body {
    width: 100%; height: 100%;
    background-color: var(--paper);
    background-image:
      radial-gradient(rgba(26,22,18,.02) 1px, transparent 1px),
      radial-gradient(rgba(26,22,18,.015) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── LOADING ── */
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background-color: var(--paper);
    background-image:
      radial-gradient(rgba(26,22,18,.02) 1px, transparent 1px),
      radial-gradient(rgba(26,22,18,.015) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    z-index: 100;
    transition: opacity .6s ease, visibility .6s ease;
  }
  #loading.hidden { opacity: 0; visibility: hidden; }

  .loader-ring {
    width: 40px; height: 40px;
    border: 1px solid var(--rule);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1.2s linear infinite;
    margin-bottom: 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: .2em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ── ERROR ── */
  #error {
    position: fixed; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background-color: var(--paper);
    z-index: 99;
    gap: 14px;
    padding: 40px;
    text-align: center;
  }
  #error.visible { display: flex; }
  #error h2 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-variation-settings: 'opsz' 144;
    font-size: 22px;
    letter-spacing: .03em;
    color: var(--ink);
  }
  #error p {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: .1em;
    color: var(--muted);
    line-height: 1.9;
  }
  #error code {
    display: inline-block;
    border: 1px solid var(--rule);
    padding: 2px 7px;
    border-radius: 2px;
    font-size: 11px;
    color: var(--accent);
  }

  /* ── STAGE ── */
  #stage {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── CANVAS ── */
  #pdf-canvas {
    display: block;
    max-width: calc(100vw - 160px);
    max-height: calc(100vh - 80px);
    box-shadow:
      0 2px 8px rgba(26,22,18,.08),
      0 8px 40px rgba(26,22,18,.14),
      0 0 0 1px rgba(26,22,18,.07);
    transition: opacity .22s ease;
  }

  /* ── NAV ARROWS ── */
  .nav-btn {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 52px; height: 52px;
    background: transparent;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: .22;
    transition: opacity .2s ease;
    z-index: 10;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-btn:hover { opacity: .7; }
  .nav-btn:disabled { opacity: .08; cursor: default; }
  .nav-btn svg { width: 26px; height: 26px; }
  .nav-btn svg path {
    stroke: var(--ink);
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #btn-prev { left: 20px; }
  #btn-next { right: 20px; }

  /* ── BOTTOM BAR ── */
  #bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 48px;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    background: linear-gradient(transparent, rgba(245,240,232,.75));
    pointer-events: none;
  }

  #page-counter {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: .2em;
    color: var(--muted);
    text-transform: uppercase;
    user-select: none;
  }

  /* ── FULLSCREEN ── */
  #btn-fs {
    position: fixed; top: 18px; right: 20px;
    background: transparent; border: none;
    cursor: pointer;
    opacity: .2;
    transition: opacity .2s ease;
    z-index: 10;
    -webkit-tap-highlight-color: transparent;
  }
  #btn-fs:hover { opacity: .55; }
  #btn-fs svg { width: 17px; height: 17px; }
  #btn-fs svg path {
    stroke: var(--ink);
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
  }

  /* ── KEYBOARD HINT ── */
  #hint {
    position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
    font-family: 'DM Mono', monospace;
    font-size: 9px; letter-spacing: .2em;
    color: var(--muted);
    opacity: .5;
    text-transform: uppercase;
    white-space: nowrap;
    pointer-events: none;
    animation: fadeHint 4s ease forwards;
    animation-delay: 2.5s;
  }
  @keyframes fadeHint { 0%{opacity:.5} 80%{opacity:.5} 100%{opacity:0} }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    #pdf-canvas {
      max-width: 100vw;
      max-height: calc(100vh - 64px);
    }
    .nav-btn { width: 40px; }
    #btn-prev { left: 4px; }
    #btn-next { right: 4px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="loader-ring"></div>
  <div class="loader-text">chargement</div>
</div>

<div id="error">
  <h2>Document introuvable</h2>
  <p>Ajoutez le paramètre <code>?pdf=URL</code> à l'adresse,<br>ou vérifiez que l'URL du document est correcte.</p>
</div>

<div id="stage">
  <canvas id="pdf-canvas"></canvas>
</div>

<button class="nav-btn" id="btn-prev" aria-label="Page précédente" disabled>
  <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<button class="nav-btn" id="btn-next" aria-label="Page suivante" disabled>
  <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
</button>

<button id="btn-fs" aria-label="Plein écran">
  <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
</button>

<div id="bar">
  <span id="page-counter"></span>
</div>

<div id="hint">← → pour naviguer</div>

<script>
(function () {
  'use strict';

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const canvas   = document.getElementById('pdf-canvas');
  const ctx      = canvas.getContext('2d');
  const btnPrev  = document.getElementById('btn-prev');
  const btnNext  = document.getElementById('btn-next');
  const btnFs    = document.getElementById('btn-fs');
  const counter  = document.getElementById('page-counter');
  const loading  = document.getElementById('loading');
  const errorDiv = document.getElementById('error');

  let pdfDoc    = null;
  let pageNum   = 1;
  let rendering = false;
  let pendingPage = null;

  function getPdfUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('pdf') || null;
  }

  function renderPage(num) {
    if (rendering) { pendingPage = num; return; }
    rendering = true;
    canvas.style.opacity = '0';

    pdfDoc.getPage(num).then(function (page) {
      const vw = window.innerWidth  - (window.innerWidth < 600 ? 0 : 160);
      const vh = window.innerHeight - 80;
      const vp0 = page.getViewport({ scale: 1 });
      const scale = Math.min(vw / vp0.width, vh / vp0.height);
      const vp = page.getViewport({ scale });

      canvas.width  = vp.width;
      canvas.height = vp.height;

      page.render({ canvasContext: ctx, viewport: vp }).promise.then(function () {
        rendering = false;
        canvas.style.opacity = '1';
        updateUI();
        if (pendingPage !== null) {
          const p = pendingPage; pendingPage = null;
          renderPage(p);
        }
      });
    }).catch(function (err) {
      console.error(err); rendering = false;
    });
  }

  function updateUI() {
    counter.textContent = pageNum + ' / ' + pdfDoc.numPages;
    btnPrev.disabled = pageNum <= 1;
    btnNext.disabled = pageNum >= pdfDoc.numPages;
  }

  function prevPage() { if (pageNum > 1) { pageNum--; renderPage(pageNum); } }
  function nextPage() { if (pdfDoc && pageNum < pdfDoc.numPages) { pageNum++; renderPage(pageNum); } }

  btnPrev.addEventListener('click', prevPage);
  btnNext.addEventListener('click', nextPage);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prevPage();
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextPage();
  });

  let touchStartX = 0;
  document.addEventListener('touchstart', function (e) {
    touchStartX = e.changedTouches[0].clientX;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) { dx < 0 ? nextPage() : prevPage(); }
  }, { passive: true });

  btnFs.addEventListener('click', function () {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  });

  let resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (pdfDoc) renderPage(pageNum); }, 200);
  });

  const pdfUrl = getPdfUrl();
  if (!pdfUrl) {
    loading.classList.add('hidden');
    errorDiv.classList.add('visible');
    return;
  }

  pdfjsLib.getDocument(pdfUrl).promise.then(function (doc) {
    pdfDoc = doc;
    renderPage(pageNum);
    loading.classList.add('hidden');
  }).catch(function (err) {
    console.error(err);
    loading.classList.add('hidden');
    errorDiv.classList.add('visible');
  });

})();
</script>
</body>
</html>
